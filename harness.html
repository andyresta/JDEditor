<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Editor layout harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Stand-in for what Tauri injects. Every media path resolves to one
      // real file so playback can actually be exercised.
      window.__TAURI_INTERNALS__ = {
        convertFileSrc: () => "/test-clip.mp4",
        metadata: { currentWindow: { label: "main" } },
        invoke: () => Promise.resolve(null),
        transformCallback: () => 0,
      };
    </script>
    <script type="module" src="/src/harness.tsx"></script>
  </body>
</html>
